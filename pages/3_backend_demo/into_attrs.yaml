
back_str:
  widget: str
  label: "str"

back_text:
  widget: text
  label: "text"
  rows: 2

back_int:
  widget: int
  label: "int"

back_float:
  widget: float
  label: "float"

back_ip:
  widget: ip
  label: "ip-адрес"

back_ip_mask:
  widget: ip_mask
  label: "ip с маской"

back_date:
  widget: date
  label: "дата"

back_time:
  widget: time
  label: "время"

back_datetime:
  widget: datetime
  label: "дата и время"

back_button_1:
  widget: button
  label: Заполнить виджеты
  select_attrs:
    back_str: col_1
    back_text: col_2
    back_int: col_3
    back_float: col_4
    back_ip: col_5
    back_ip_mask: col_6
    back_date: col_7
    back_time: col_8
    back_datetime: col_9
  command: test_select_1 -pg

back_button_2:
  widget: button
  label: Заполнить виджеты
  select_attrs: col_1, col_2, col_3, col_4, col_5, col_6, col_7, col_8, col_9
  command: |
    SELECT *
    FROM test_table
    LIMIT 1;

col_1:
  widget: str
  label: "str"

col_2:
  widget: text
  label: "text"
  rows: 1

col_3:
  widget: int
  label: "int"

col_4:
  widget: float
  label: "float"

col_5:
  widget: ip
  label: "ip-адрес"

col_6:
  widget: ip_mask
  label: "ip с маской"

col_7:
  widget: date
  label: "дата"

col_8:
  widget: time
  label: "время"

col_9:
  widget: datetime
  label: "дата и время"

back_list:
  widget: list
  label: "list"
  columns: code
  source: test_voc_1 -pg

back_list_2:
  widget: list
  label: "list-only"
  editable: false
  columns: code
  source: |
    SELECT *
    FROM voc_1;

back_multilist:
  widget: list
  label: "multi-list"
  multiselect: true
  source: test_voc_1 -pg
  columns: description
  sup_text: "Другой столбец для multiselect"

voc_1_db:
  widget: voc
  label: "Код операции"
  columns: |
    code /Код
    description /Значение
  source: test_voc_1 -pg

voc_3_db:
  widget: voc
  label: "Виды документов"
  columns: |
    code /Код
    description /Значение
  multiselect: true
  source: |
    SELECT *
    FROM voc_3
    ORDER BY code;

back_button_3:
  widget: button
  label: Заполнить таблицу
  select_attrs: back_table
  command: |
    SELECT user_id, last_seen_at, user_agent
    FROM user_sessions;

back_table:
  widget: table
  label: "Таблица из запроса"
  table_attrs: |
    user_id :100
    last_seen_at :200
    user_agent :600

# input_attrs: [attr_1, attr_2] - записываем В бд
